%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/syna,s3910.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics S3910 TouchComm SPI touchscreen controller

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The Synaptics S3910 is a touchscreen controller that speaks the Synaptics
  TouchComm protocol over SPI. It runs its application firmware from its own
  flash.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: syna,s3910

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  panel:
    maxItems: 1
    description: Display panel followed for gesture-sleep entry and exit.

  wakeup-source: true

  reset-gpios:
    maxItems: 1
    description: GPIO connected to the active-low reset input.

  vdd-supply:
    description: Digital and I/O supply (1.8 V).

  avdd-supply:
    description: Analog supply.

  syna,report-rate:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 0xffff
    description:
      Touch report rate applied whenever the panel turns on, as the firmware's
      own rate code (dynamic configuration 0xe6). Absent or 0 keeps the rate
      the firmware starts with.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - vdd-supply
  - avdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "syna,s3910";
            reg = <0>;
            spi-max-frequency = <19000000>;
            interrupt-parent = <&tlmm>;
            interrupts = <25 IRQ_TYPE_LEVEL_LOW>;
            reset-gpios = <&tlmm 24 GPIO_ACTIVE_LOW>;
            vdd-supply = <&vreg_l4b_1p8>;
            avdd-supply = <&ts_avdd>;
        };
    };
