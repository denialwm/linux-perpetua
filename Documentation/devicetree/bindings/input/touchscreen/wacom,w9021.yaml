%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/wacom,w9021.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Wacom W9021 EMR digitizer with Samsung firmware

maintainers:
  - rafroad <rafan.second@gmail.com>

description:
  The electromagnetic pen digitizer (S Pen) of the Galaxy Tab S7 FE, on
  I2C. Its firmware reports pen packets on a level-low interrupt.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: wacom,w9021

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vdd-supply:
    description: Analog supply of the digitizer.

  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-swapped-x-y: true

required:
  - compatible
  - reg
  - interrupts
  - vdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        digitizer@56 {
            compatible = "wacom,w9021";
            reg = <0x56>;
            interrupts-extended = <&tlmm 85 IRQ_TYPE_LEVEL_LOW>;
            vdd-supply = <&vreg_l8a>;
            touchscreen-inverted-x;
            touchscreen-swapped-x-y;
        };
    };
...
