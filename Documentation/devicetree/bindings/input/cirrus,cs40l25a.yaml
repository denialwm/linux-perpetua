%YAML 1.2
---
$id: http://devicetree.org/schemas/input/cirrus,cs40l25a.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cirrus Logic CS40L25A Boosted Haptic Driver

maintainers:
  - Noswad <64293615+TheNoswad@users.noreply.github.com>

description:
  The CS40L25A drives a linear resonant actuator (LRA) from its internal
  boost converter. Its Halo Core DSP runs firmware loaded by the host,
  which plays the effects of a wavetable and timed vibrations.

properties:
  compatible:
    enum:
      - cirrus,cs40l25a

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      The 32.768 kHz reference clock on the MCLK/GPIO2 pin, which the DSP
      runs from.

  va-supply:
    description: Power supply for the analog and digital circuits (VA).

  vp-supply:
    description: Power supply for the boost converter (VP).

  firmware-name:
    maxItems: 1
    description:
      The DSP firmware (.wmfw) to load. A coefficient file of the same name
      ending in .bin, when present, is loaded after the wavetable.
    default: cs40l25a.wmfw

  cirrus,boost-ind-nanohenry:
    description: Inductance of the boost inductor.
    enum: [1000, 1200, 1500, 2200]

  cirrus,boost-cap-microfarad:
    description: Total equivalent capacitance on VBST.

  cirrus,boost-peak-milliamp:
    description: Peak current limit of the boost converter.
    minimum: 1600
    maximum: 4500
    multipleOf: 50

  cirrus,boost-ctl-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Boost converter output voltage.
    minimum: 2550
    maximum: 11000
    multipleOf: 50
    default: 11000

  cirrus,boost-ovp-millivolt:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Overvoltage protection threshold of the boost converter. The
      chip's default is kept when absent.
    minimum: 9000
    maximum: 12875
    multipleOf: 125

  cirrus,boost-dcm-disable:
    type: boolean
    description:
      Keep the boost converter out of discontinuous conduction mode.

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - cirrus,boost-ind-nanohenry
  - cirrus,boost-cap-microfarad
  - cirrus,boost-peak-milliamp

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      haptic-driver@43 {
        compatible = "cirrus,cs40l25a";
        reg = <0x43>;
        interrupt-parent = <&gpa6>;
        interrupts = <5 IRQ_TYPE_LEVEL_LOW>;
        reset-gpios = <&gpp24 0 GPIO_ACTIVE_LOW>;
        clocks = <&s2mpg10_clk 1>;
        firmware-name = "cs40l25a_clab.wmfw";
        cirrus,boost-ind-nanohenry = <1000>;
        cirrus,boost-cap-microfarad = <4>;
        cirrus,boost-peak-milliamp = <4500>;
        cirrus,boost-ctl-millivolt = <7500>;
        cirrus,boost-ovp-millivolt = <12000>;
        cirrus,boost-dcm-disable;
      };
    };
