%YAML 1.2
---
$id: http://devicetree.org/schemas/input/ti,drv2624.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments DRV2624 haptic driver

description: |
  The DRV2624 is a closed-loop and open-loop haptic driver with a Class-D
  amplifier. The driver exposes it as a simple rumble effect through the
  force feedback interface and drives it in real-time playback mode.

maintainers:
  - Bronson <bronsonmathews@gmail.com>

properties:
  compatible:
    const: ti,drv2624

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Reset line of the controller.

  ti,rated-voltage:
    $ref: /schemas/types.yaml#/definitions/uint8
    default: 0x6d
    description: Rated voltage of the actuator, as the register value.

  ti,odclamp-voltage:
    $ref: /schemas/types.yaml#/definitions/uint8
    default: 0xa1
    description: Overdrive clamp voltage of the actuator, as the register value.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        haptics@5a {
            compatible = "ti,drv2624";
            reg = <0x5a>;
            reset-gpios = <&pm7250b_gpios 1 GPIO_ACTIVE_HIGH>;
            ti,rated-voltage = /bits/ 8 <109>;
            ti,odclamp-voltage = /bits/ 8 <161>;
        };
    };
...
