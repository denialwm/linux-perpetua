%YAML 1.2
---
$id: http://devicetree.org/schemas/input/awinic,aw96205.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW9620x capacitive sensor as a key

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The AW9620x capacitive proximity sensors run a program from their own
  flash and take their configuration from a register file. Used as a key,
  the sensor reports its first channel past its first threshold as one
  key press, such as a phone's shoulder trigger.

allOf:
  - $ref: input.yaml#

properties:
  compatible:
    const: awinic,aw96205

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  vcc-supply: true

  firmware-name:
    maxItems: 1
    description: The vendor register file that configures the sensor.

  label:
    description: The input device's name.

  linux,code: true

required:
  - compatible
  - reg
  - interrupts
  - vcc-supply
  - firmware-name
  - linux,code

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/input/input.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        trigger@13 {
            compatible = "awinic,aw96205";
            reg = <0x13>;
            interrupts-extended = <&tlmm 200 IRQ_TYPE_EDGE_FALLING>;
            vcc-supply = <&vreg_l9b_2p9>;
            firmware-name = "aw9620x_reg_0.bin";
            label = "Left shoulder trigger";
            linux,code = <KEY_MACRO1>;
        };
    };
