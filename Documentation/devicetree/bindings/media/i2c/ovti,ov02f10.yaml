%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov02f10.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV02F10 Image Sensor

description:
  OmniVision OV02F10 is a 2MP image sensor. The sensor is controlled over a
  serial camera control bus protocol, the widest output image frame size
  is 1600x1200, data output format is RAW10 transferred over a 1-lane
  MIPI D-PHY interface.

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov02f10

  reg:
    maxItems: 1

  clocks:
    description: MCLK supply clock.
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the XSHUTDOWN pad of the sensor.
    maxItems: 1

  avdd-supply:
    description: Analogue voltage supply.

  dovdd-supply:
    description: Digital I/O voltage supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
      #include <dt-bindings/gpio/gpio.h>

      i2c {
          #address-cells = <1>;
          #size-cells = <0>;

          camera@3d {
              compatible = "ovti,ov02f10";
              reg = <0x3d>;
              clocks = <&camera_mclk 3>;
              assigned-clocks = <&camera_mclk 3>;
              assigned-clock-rates = <19200000>;
              reset-gpios = <&gpio1 105 GPIO_ACTIVE_LOW>;
              avdd-supply = <&vreg_cam_ana>;
              dovdd-supply = <&vreg_cam_io>;

              port {
                  endpoint {
                      data-lanes = <1>;
                      link-frequencies = /bits/ 64 <330000000>;
                      remote-endpoint = <&mipi_csi2_ep>;
                  };
              };
          };
      };
...
