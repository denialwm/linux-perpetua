%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov50d40.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV50D40 Image Sensor

description:
  OmniVision OV50D40 is a 50MP image sensor. The sensor is controlled over a
  serial camera control bus protocol, the widest output image frame size
  is 8192x6144, data output format is RAW10 transferred over a 4-lane
  MIPI D-PHY interface.

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov50d40

  reg:
    maxItems: 1

  clocks:
    description: MCLK supply clock.
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the XSHUTDOWN pad of the sensor.
    maxItems: 1

  avdd-supply:
    description: Analogue voltage supply.

  dvdd-supply:
    description: Digital core voltage supply, 1.1 volts.

  dovdd-supply:
    description: Digital I/O voltage supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - port

unevaluatedProperties: false

examples:
  - |
      #include <dt-bindings/gpio/gpio.h>

      i2c {
          #address-cells = <1>;
          #size-cells = <0>;

          camera@22 {
              compatible = "ovti,ov50d40";
              reg = <0x22>;
              clocks = <&camera_mclk 1>;
              assigned-clocks = <&camera_mclk 1>;
              assigned-clock-rates = <24000000>;
              reset-gpios = <&gpio1 15 GPIO_ACTIVE_LOW>;
              avdd-supply = <&vreg_cam_ana>;
              dvdd-supply = <&vreg_1p1>;
              dovdd-supply = <&vreg_cam_io>;

              port {
                  endpoint {
                      data-lanes = <1 2 3 4>;
                      link-frequencies = /bits/ 64 <951000000>;
                      remote-endpoint = <&mipi_csi2_ep>;
                  };
              };
          };
      };
...
