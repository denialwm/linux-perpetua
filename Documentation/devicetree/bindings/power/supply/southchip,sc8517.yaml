%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/southchip,sc8517.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Southchip SC8517 direct charger and SuperVOOC PHY

maintainers:
  - Sebastian Reichel <sre@kernel.org>

description: |
  The SC8517 negotiates SuperVOOC charging and connects the adapter to a
  two-cell battery pack. Two external switches route USB D+/D- between the
  application processor and the charging PHY. A discrete fuel gauge provides
  pack voltage, current, temperature, and state of charge. The Qualcomm PMIC
  GLINK USB power supply detects the cable and controls the parallel buck path.

properties:
  compatible:
    const: southchip,sc8517

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  fuel-gauge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Fuel gauge reporting the two-cell pack, including pack voltage.

  switch-ctrl-gpios:
    maxItems: 1
    description: Route the USB lines to the charging PHY when asserted.

  vphy-switch-gpios:
    maxItems: 1
    description: Select the SuperVOOC charging path when asserted.

required:
  - compatible
  - reg
  - interrupts
  - fuel-gauge
  - switch-ctrl-gpios
  - vphy-switch-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        charger@69 {
            compatible = "southchip,sc8517";
            reg = <0x69>;
            interrupt-parent = <&tlmm>;
            interrupts = <9 IRQ_TYPE_EDGE_FALLING>;
            fuel-gauge = <&fuel_gauge>;
            switch-ctrl-gpios = <&pm8550b_gpios 2 GPIO_ACTIVE_HIGH>;
            vphy-switch-gpios = <&pm8550b_gpios 8 GPIO_ACTIVE_HIGH>;
        };
    };
