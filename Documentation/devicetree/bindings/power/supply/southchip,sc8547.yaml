%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/southchip,sc8547.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Southchip SC8547D 2:1 charge pump

maintainers:
  - Sebastian Reichel <sre@kernel.org>

description: |
  The SC8547D is a 2:1 switched-capacitor charge pump for single-cell
  batteries. It measures its input, output and battery, and stops on its
  own protection limits or when its watchdog expires. Some boards also use
  its built-in VOOC PHY, which talks to the adapter over USB D+/D- while a
  direct charging driver runs the pump.

properties:
  compatible:
    const: southchip,sc8547d

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  southchip,vbat-ovp-microvolt:
    description: Battery overvoltage limit.
    minimum: 3500000
    maximum: 5075000
    multipleOf: 25000
    default: 4650000

  southchip,vbus-ovp-microvolt:
    description: Input overvoltage limit.
    minimum: 6000000
    maximum: 12350000
    multipleOf: 50000
    default: 10000000

  southchip,ibus-ocp-microamp:
    description: Input overcurrent limit.
    minimum: 1200000
    maximum: 5700000
    multipleOf: 300000
    default: 3600000

  southchip,switching-frequency-hz:
    enum: [500000, 600000]
    default: 500000

  southchip,always-otg-en:
    type: boolean
    description: Keep the OTG enable bit set at all times.

  vooc-phy:
    type: object
    description: The built-in VOOC PHY, used by a direct charging driver.
    additionalProperties: false

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        charge-pump@6a {
            compatible = "southchip,sc8547d";
            reg = <0x6a>;
            interrupt-parent = <&tlmm>;
            interrupts = <0 IRQ_TYPE_EDGE_FALLING>;
            southchip,vbat-ovp-microvolt = <4850000>;
            southchip,vbus-ovp-microvolt = <10500000>;
            southchip,ibus-ocp-microamp = <3600000>;
            southchip,always-otg-en;

            vooc-phy {
            };
        };
    };
