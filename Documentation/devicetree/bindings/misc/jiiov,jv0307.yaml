%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/jiiov,jv0307.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: JIIOV JV0307 optical fingerprint platform control

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description: |
  Power, reset and interrupt wiring for a JIIOV under-display optical
  fingerprint sensor. The secure world owns the SPI bus; biometric
  commands go to the signed trusted application through the TEE
  subsystem.

properties:
  compatible:
    const: jiiov,jv0307

  reset-gpios:
    maxItems: 1
    description: Active-low sensor reset.

  interrupt-gpios:
    maxItems: 1
    description: Active-high sensor interrupt, sampled on the rising edge.

  vdd-supply:
    description: Sensor supply.

  pinctrl-0: true
  pinctrl-names:
    const: default

required:
  - compatible
  - reset-gpios
  - interrupt-gpios
  - vdd-supply

additionalProperties: false
