%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/oneplus,aston-fingerprint.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OnePlus Aston UFF optical fingerprint platform control

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description: |
  Power, reset and interrupt wiring for the Aston secure optical fingerprint
  sensor. The secure world owns the sensor bus; no SPI controller or biometric
  data is exposed by this platform device.

properties:
  compatible:
    const: oneplus,aston-fingerprint
  reset-gpios:
    maxItems: 1
    description: Active-low sensor reset.
  interrupt-gpios:
    maxItems: 1
    description: Active-high sensor interrupt, sampled on the rising edge.
  vdd-supply:
    description: Sensor analog supply at 3.01 V.

required:
  - compatible
  - reset-gpios
  - interrupt-gpios
  - vdd-supply

additionalProperties: false
