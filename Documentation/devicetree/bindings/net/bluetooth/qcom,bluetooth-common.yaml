%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/qcom,bluetooth-common.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Bluetooth Common Properties

maintainers:
  - Balakrishna Godavarthi <quic_bgodavar@quicinc.com>
  - Rocky Liao <quic_rjliao@quicinc.com>

properties:
  firmware-name:
    minItems: 1
    items:
      - description: specify the name of nvm firmware to load
      - description: specify the name of rampatch firmware to load

  qcom,local-bd-address-broken:
    type: boolean
    description:
      boot firmware is incorrectly passing the address in big-endian order

  qcom,disable-ibs:
    type: boolean
    description:
      The controller does not answer standard HCI commands while the QCA
      in-band-sleep protocol is enabled. Send commands without the IBS
      wake/sleep handshake.

  qcom,use-firmware-bdaddr:
    type: boolean
    description:
      The controller reports a usable public address. Keep that address
      instead of taking one from local-bd-address.

additionalProperties: true
