%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/maxim,max77816.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX77816 buck-boost regulator

maintainers:
  - rafroad <rafan.second@gmail.com>

description:
  A buck-boost with I2C control, used as a fixed 5.0 V supply switched by
  its EN pin; the driver sets the output to 5.0 V after each enable.

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    const: maxim,max77816

  reg:
    maxItems: 1

  enable-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - enable-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        regulator@18 {
            compatible = "maxim,max77816";
            reg = <0x18>;
            enable-gpios = <&tlmm 72 GPIO_ACTIVE_HIGH>;
            regulator-name = "backlight_boost";
            regulator-min-microvolt = <5000000>;
            regulator-max-microvolt = <5000000>;
        };
    };
...
