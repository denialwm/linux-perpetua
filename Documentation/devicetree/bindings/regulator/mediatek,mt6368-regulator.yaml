%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/mediatek,mt6368-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6368 PMIC LDO regulators

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The MT6368 SPMI PMIC has LDO regulators for the connectivity, audio, card,
  touch and fingerprint rails of MT6897 boards. Each LDO is a child node named
  after it.

properties:
  compatible:
    const: mediatek,mt6368-regulator

patternProperties:
  "^v(usb|aux18|rf13-aif|rf18-aif|ant18|ibr|io28|fp|tp|mch|mc|aud18|cn33-[12]|efuse|sim2)$":
    type: object
    $ref: regulator.yaml#
    unevaluatedProperties: false
    properties:
      regulator-allowed-modes:
        description: Operating modes, 0 for normal and 2 for low power.
        items:
          enum: [0, 2]

required:
  - compatible

additionalProperties: false

examples:
  - |
    regulators {
      compatible = "mediatek,mt6368-regulator";

      vcn33-1 {
        regulator-min-microvolt = <3300000>;
        regulator-max-microvolt = <3300000>;
      };
    };
