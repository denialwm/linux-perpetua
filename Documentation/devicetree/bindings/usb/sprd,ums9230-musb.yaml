%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/sprd,ums9230-musb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Unisoc UMS9230 MUSB controller

maintainers:
  - Otto Pflüger <otto.pflueger@abscue.de>

allOf:
  - $ref: usb-drd.yaml#

properties:
  compatible:
    items:
      - const: sprd,ums9230-musb
      - const: sprd,musb

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    const: mc

  clocks:
    maxItems: 1

  phys:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - phys

unevaluatedProperties: false
