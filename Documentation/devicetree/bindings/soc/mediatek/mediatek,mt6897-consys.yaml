%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6897-consys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6897 connectivity subsystem

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The connectivity subsystem holds the Wi-Fi, Bluetooth and GNSS cores of
  the SoC behind a shared infrastructure, and drives a separate radio die
  over a few dedicated pins. The secure world performs its low-level
  power-on. The radios are child nodes in its register window.

properties:
  compatible:
    const: mediatek,mt6897-consys

  reg:
    maxItems: 1

  ranges: true

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  clocks:
    items:
      - description:
          The radio die's reference clock, 26 or 52 MHz, from the PMIC's
          clock buffer or from a TCXO.

  mediatek,tcxo:
    type: boolean
    description:
      The reference clock comes from a TCXO rather than the PMIC's clock
      buffer.

  power-domains:
    maxItems: 1

  memory-region:
    maxItems: 1
    description:
      The memory where the bootloader loads the radios' firmware.

  pinctrl-names:
    items:
      - const: default
      - const: sleep

  pinctrl-0: true
  pinctrl-1: true

  vcn13-supply:
    description: The 1.3 V supply of the radio die.

  vrf-io18-supply:
    description: The 1.8 V supply of the radio die's interface.

  vant18-supply:
    description: The 1.8 V supply of the antenna switches.

  vcn33-1-supply:
    description: The first 3.3 V supply of the front end.

  vcn33-2-supply:
    description: The second 3.3 V supply of the front end.

patternProperties:
  "^wifi@[0-9a-f]+$":
    type: object
    $ref: /schemas/net/wireless/mediatek,mt76.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - ranges
  - "#address-cells"
  - "#size-cells"
  - clocks
  - power-domains
  - pinctrl-names
  - pinctrl-0
  - pinctrl-1
  - vcn13-supply
  - vrf-io18-supply
  - vant18-supply
  - vcn33-1-supply
  - vcn33-2-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/mediatek,mt6897-power.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        connectivity@18000000 {
            compatible = "mediatek,mt6897-consys";
            reg = <0 0x18000000 0 0x700000>;
            ranges = <0 0 0x18000000 0x700000>;
            #address-cells = <1>;
            #size-cells = <1>;
            clocks = <&conn_clk>;
            power-domains = <&spm MT6897_POWER_DOMAIN_CONN>;
            memory-region = <&consys_firmware>;
            pinctrl-names = "default", "sleep";
            pinctrl-0 = <&conn_pins>;
            pinctrl-1 = <&conn_sleep_pins>;
            vcn13-supply = <&vcn13>;
            vrf-io18-supply = <&vrf_io18>;
            vant18-supply = <&vant18>;
            vcn33-1-supply = <&vcn33_1>;
            vcn33-2-supply = <&vcn33_2>;

            wifi@0 {
                compatible = "mediatek,mt6897-wifi";
                reg = <0 0x700000>;
                interrupts = <GIC_SPI 889 IRQ_TYPE_LEVEL_HIGH>;
                memory-region = <&wifi_dma>;
            };
        };
    };
