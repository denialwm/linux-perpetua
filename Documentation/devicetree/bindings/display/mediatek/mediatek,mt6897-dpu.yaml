%YAML 1.2
---
$id: http://devicetree.org/schemas/display/mediatek/mediatek,mt6897-dpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6897 display processor

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The display pipeline of the MediaTek MT6897 (Dimensity 8300) SoC. Each
  frame is split into two vertical stripes, one per pipe; each pipe has
  its own overlay engine (OVL) in its own OVL subsystem, and its own DSC
  encoder and DSI link in its own display subsystem. The processor owns
  each subsystem whole, with its routing, its mutexes and its engines.

properties:
  compatible:
    const: mediatek,mt6897-dpu

  reg:
    items:
      - description: display subsystem of the first pipe, with the master
          DSI link
      - description: display subsystem of the second pipe
      - description: OVL subsystem of the first pipe
      - description: OVL subsystem of the second pipe

  reg-names:
    items:
      - const: dispsys0
      - const: dispsys1
      - const: ovlsys0
      - const: ovlsys1

  interrupts:
    items:
      - description: overlay engine of the first pipe
      - description: overlay engine of the second pipe

  interrupt-names:
    items:
      - const: ovl0
      - const: ovl1

  clocks:
    items:
      - description: high-speed clock of the first DSI link, from its PHY
      - description: high-speed clock of the second DSI link, from its PHY

  clock-names:
    items:
      - const: dsi0-hs
      - const: dsi1-hs

  phys:
    items:
      - description: MIPI D-PHY of the first DSI link
      - description: MIPI D-PHY of the second DSI link

  phy-names:
    items:
      - const: dsi0
      - const: dsi1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^panel@[0-3]$":
    type: object
    description:
      The panel on the DSI links. Commands go out on both links at once.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - phys
  - phy-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    display-controller@14000000 {
        compatible = "mediatek,mt6897-dpu";
        reg = <0x14000000 0xe000>, <0x14200000 0xe000>,
              <0x14400000 0x3000>, <0x14600000 0x3000>;
        reg-names = "dispsys0", "dispsys1", "ovlsys0", "ovlsys1";
        interrupts = <GIC_SPI 387 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 431 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "ovl0", "ovl1";
        clocks = <&mipi_tx0>, <&mipi_tx1>;
        clock-names = "dsi0-hs", "dsi1-hs";
        phys = <&mipi_tx0>, <&mipi_tx1>;
        phy-names = "dsi0", "dsi1";
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "lenovo,tb373fu-tianma-nt36532", "novatek,nt36532";
            reg = <0>;
            reset-gpios = <&pio 41 1>;
            vddi-supply = <&panel_vddi>;
            avdd-supply = <&panel_avdd>;
            avee-supply = <&panel_avee>;
        };
    };
