%YAML 1.2
---
$id: http://devicetree.org/schemas/display/mediatek/mediatek,mt6897-dpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6897 display processor

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The display pipeline of the MediaTek MT6897 (Dimensity 8300) SoC. Each
  frame is split into two vertical stripes, one per pipe; each pipe has
  its own overlay engine (OVL) in its own OVL subsystem, its own display
  subsystem and its own DSI link.

properties:
  compatible:
    const: mediatek,mt6897-dpu

  reg:
    items:
      - description: overlay engine of the first pipe
      - description: overlay engine of the second pipe

  reg-names:
    items:
      - const: ovl0
      - const: ovl1

  interrupts:
    items:
      - description: overlay engine of the first pipe
      - description: overlay engine of the second pipe

  interrupt-names:
    items:
      - const: ovl0
      - const: ovl1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    display-controller@14402000 {
        compatible = "mediatek,mt6897-dpu";
        reg = <0x14402000 0x1000>, <0x14602000 0x1000>;
        reg-names = "ovl0", "ovl1";
        interrupts = <GIC_SPI 387 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 431 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "ovl0", "ovl1";
    };
