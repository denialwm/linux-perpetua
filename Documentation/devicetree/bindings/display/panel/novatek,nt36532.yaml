%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt36532.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36532 based DSI display panels

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The Novatek NT36532 is a display driver IC for tablet panels, fed by two
  DSI links, one per vertical stripe of the frame. The panel node sits on
  the host that drives both links.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - enum:
          - lenovo,tb373fu-tianma-nt36532
      - const: novatek,nt36532

  reg:
    maxItems: 1
    description: DSI virtual channel

  vddi-supply: true
  avdd-supply: true
  avee-supply: true
  reset-gpios: true
  backlight: true

required:
  - compatible
  - reg
  - vddi-supply
  - avdd-supply
  - avee-supply
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "lenovo,tb373fu-tianma-nt36532", "novatek,nt36532";
            reg = <0>;
            reset-gpios = <&pio 41 GPIO_ACTIVE_LOW>;
            vddi-supply = <&panel_vddi>;
            avdd-supply = <&panel_avdd>;
            avee-supply = <&panel_avee>;
            backlight = <&backlight>;
        };
    };
...
