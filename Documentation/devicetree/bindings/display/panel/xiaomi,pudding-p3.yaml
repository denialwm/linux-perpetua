%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/xiaomi,pudding-p3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi 17 P3 42 02 0a AMOLED DSI panel

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The 6.3" 1220x2656 AMOLED panel of the Xiaomi 17 (pudding), which Xiaomi
  names P3 42 02 0a. It runs a Novatek controller in video mode with DSC at
  10 bits per component.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: xiaomi,pudding-p3-42-02-0a

  reg:
    maxItems: 1
    description: DSI virtual channel

  vci-supply: true
  vddd-supply: true
  vddio-supply: true
  port: true
  reset-gpios: true

  pmic-reset-gpios:
    maxItems: 1
    description: Reset of the panel's OLED power chip

required:
  - compatible
  - reg
  - vci-supply
  - vddd-supply
  - vddio-supply
  - port
  - reset-gpios
  - pmic-reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "xiaomi,pudding-p3-42-02-0a";
            reg = <0>;

            vci-supply = <&vreg_l14b>;
            vddd-supply = <&vreg_panel_vddd>;
            vddio-supply = <&vreg_l12b>;

            reset-gpios = <&tlmm 98 GPIO_ACTIVE_LOW>;
            pmic-reset-gpios = <&tlmm 171 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&mdss_dsi0_out>;
                };
            };
        };
    };
...
