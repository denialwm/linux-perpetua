%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/oneplus,erhai-nt36536.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OnePlus Pad 3 NT36536 LCD panel

maintainers:
  - Travis Geisinger <travis@geisinger.dev>

description:
  The 3392x2400 LCD panel of the OnePlus Pad 3 (erhai), which OnePlus names
  XN242. Its Novatek NT36536 controller takes two DSI links of four lanes,
  1696 pixels each, in video mode with DSC 1.2 at 8 bits per component. The
  touchscreen is part of the same controller and is reset with the panel.
  Its LCD bias comes from the backlight controller.

allOf:
  - $ref: panel-common-dual.yaml#

properties:
  compatible:
    items:
      - const: oneplus,erhai-nt36536
      - const: novatek,nt36536

  reg:
    maxItems: 1
    description: DSI virtual channel

  reset-gpios:
    maxItems: 1

  error-flag-gpios:
    description:
      The error flags of the controller, one per DSI link, which it raises
      when it detected an error and its picture may be lost, for example
      after an electrostatic discharge. The panel then needs a reset and
      its setup again.
    maxItems: 2

  vddio-supply:
    description: I/O voltage rail, 1.9 V on the OnePlus Pad 3

  avdd-supply:
    description: Positive LCD bias

  avee-supply:
    description: Negative LCD bias

  pinctrl-0: true
  pinctrl-1: true
  pinctrl-names:
    items:
      - const: default
      - const: sleep

  backlight: true
  ports: true

required:
  - compatible
  - reg
  - reset-gpios
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "oneplus,erhai-nt36536";
            reg = <0>;

            reset-gpios = <&tlmm 98 GPIO_ACTIVE_LOW>;
            error-flag-gpios = <&tlmm 86 GPIO_ACTIVE_HIGH>,
                               <&tlmm 87 GPIO_ACTIVE_HIGH>;
            backlight = <&backlight>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;

                    panel_in_0: endpoint {
                        remote-endpoint = <&dsi0_out>;
                    };
                };

                port@1 {
                    reg = <1>;

                    panel_in_1: endpoint {
                        remote-endpoint = <&dsi1_out>;
                    };
                };
            };
        };
    };
...
