%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,s6e3fc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S6E3FC3 AMOLED DDIC

maintainers:
  - Noswad <64293615+TheNoswad@users.noreply.github.com>

description:
  The S6E3FC3 is a display driver IC with a connected 1080x2400 AMOLED
  panel, driven in DSI command mode, as fitted to the Google Pixel 6.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,s6e3fc3

  reg:
    maxItems: 1

  vci-supply:
    description: VCI (analog) supply

  vddi-supply:
    description: VDDI (logic and I/O) supply

required:
  - compatible
  - reg
  - reset-gpios
  - vci-supply
  - vddi-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,s6e3fc3";
            reg = <0>;
            reset-gpios = <&gpp24 1 GPIO_ACTIVE_LOW>;
            vci-supply = <&vci_disp>;
            vddi-supply = <&vddi_disp>;
        };
    };
