%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/mediatek,mt6897-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6897 Pin Controller

maintainers:
  - Doctor Logix <doctor.logix@gmail.com>

description:
  The MediaTek's MT6897 Pin controller is used to control SoC pins.

properties:
  compatible:
    const: mediatek,mt6897-pinctrl

  reg:
    items:
      - description: gpio base
      - description: rt group IO
      - description: rm group IO
      - description: bl group IO
      - description: bm group IO
      - description: br group IO
      - description: lb group IO
      - description: lt group IO
      - description: tm group IO
      - description: tl group IO
      - description: eint east group IO
      - description: eint south group IO
      - description: eint west group IO
      - description: eint north group IO
      - description: eint center group IO

  reg-names:
    items:
      - const: base
      - const: rt
      - const: rm
      - const: bl
      - const: bm
      - const: br
      - const: lb
      - const: lt
      - const: tm
      - const: tl
      - const: eint0
      - const: eint1
      - const: eint2
      - const: eint3
      - const: eint4

  interrupts:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

  gpio-controller: true

  '#gpio-cells':
    const: 2

  gpio-ranges:
    maxItems: 1

  gpio-line-names: true

# PIN CONFIGURATION NODES
patternProperties:
  '-pins$':
    type: object
    additionalProperties: false

    patternProperties:
      '^pins':
        type: object
        $ref: /schemas/pinctrl/pincfg-node.yaml
        additionalProperties: false
        description:
          A pinctrl node should contain at least one subnodes representing the
          pinctrl groups available on the machine. Each subnode will list the
          pins it needs, and how they should be configured, with regard to muxer
          configuration, pullups, drive strength, input enable/disable and input
          schmitt.

        properties:
          pinmux:
            description:
              Integer array, represents gpio pin number and mux setting.
              Supported pin number and mux varies for different SoCs, and are
              defined as macros in arch/arm64/boot/dts/mediatek/mt6897-pinfunc.h
              for this SoC.

          drive-strength:
            enum: [2, 4, 6, 8, 10, 12, 14, 16]

          bias-pull-down:
            oneOf:
              - type: boolean
                description: normal pull down.
              - enum: [100, 101, 102, 103]
                description: PUPD/R1/R0 pull down type. See MTK_PUPD_SET_R1R0_
                  defines in dt-bindings/pinctrl/mt65xx.h.
              - enum: [200, 201, 202, 203]
                description: RSEL pull down type. See MTK_PULL_SET_RSEL_ defines
                  in dt-bindings/pinctrl/mt65xx.h.

          bias-pull-up:
            oneOf:
              - type: boolean
                description: normal pull up.
              - enum: [100, 101, 102, 103]
                description: PUPD/R1/R0 pull up type. See MTK_PUPD_SET_R1R0_
                  defines in dt-bindings/pinctrl/mt65xx.h.
              - enum: [200, 201, 202, 203]
                description: RSEL pull up type. See MTK_PULL_SET_RSEL_ defines
                  in dt-bindings/pinctrl/mt65xx.h.

          bias-disable: true

          output-high: true

          output-low: true

          input-enable: true

          input-disable: true

          input-schmitt-enable: true

          input-schmitt-disable: true

        required:
          - pinmux

required:
  - compatible
  - reg
  - interrupts
  - interrupt-controller
  - '#interrupt-cells'
  - gpio-controller
  - '#gpio-cells'
  - gpio-ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/pinctrl/mt65xx.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #define PINMUX_GPIO147__FUNC_SCL5 (MTK_PIN_NO(147) | 1)
    #define PINMUX_GPIO148__FUNC_SDA5 (MTK_PIN_NO(148) | 1)

    pio: pinctrl@10005000 {
        compatible = "mediatek,mt6897-pinctrl";
        reg = <0x10005000 0x1000>,
              <0x11b20000 0x1000>,
              <0x11c00000 0x1000>,
              <0x11d30000 0x1000>,
              <0x11d40000 0x1000>,
              <0x11d50000 0x1000>,
              <0x11ea0000 0x1000>,
              <0x11eb0000 0x1000>,
              <0x11f20000 0x1000>,
              <0x11f30000 0x1000>,
              <0x11ce0000 0x1000>,
              <0x11de0000 0x1000>,
              <0x11e90000 0x1000>,
              <0x11fe0000 0x1000>,
              <0x1c01e000 0x1000>;
        reg-names = "base", "rt", "rm", "bl", "bm", "br", "lb", "lt",
                    "tm", "tl", "eint0", "eint1", "eint2", "eint3", "eint4";
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&pio 0 0 232>;
        interrupt-controller;
        interrupts = <GIC_SPI 309 IRQ_TYPE_LEVEL_HIGH 0>;
        #interrupt-cells = <2>;

        i2c5-pins {
            pins {
                pinmux = <PINMUX_GPIO147__FUNC_SCL5>,
                         <PINMUX_GPIO148__FUNC_SDA5>;
                bias-disable;
            };
        };
    };
